[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-predicted-funding"
version = "0.1.0"
description = "Binance USD-M 1-minute predicted funding-rate ingestor for duckport-rs"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "duckdb==1.5.1",
]

[tool.setuptools.packages.find]
include = ["binance_predicted_funding*"]

[project.scripts]
binance-predicted-funding = "binance_predicted_funding.main:main"
